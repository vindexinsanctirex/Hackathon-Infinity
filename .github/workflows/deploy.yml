name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Debug folder structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Folder contents:"
          ls -la
          echo "Frontend folder contents:"
          ls -la frontend/
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm install
          # Install missing dependencies that your app uses
          npm install date-fns
          # Add any other missing dependencies here if needed
          
      - name: Build
        working-directory: ./frontend
        run: |
          VITE_API_URL=https://hackathon-infinity-backend.onrender.com npm run build
        env:
          VITE_API_URL: https://hackathon-infinity-backend.onrender.com
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist