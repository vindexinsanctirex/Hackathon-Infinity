name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Debug files
        run: |
          ls -la
          echo "Current directory: $(pwd)"
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          npm install
          ls -la node_modules | head -10
          
      - name: Build
        run: |
          VITE_API_URL=https://hackathon-infinity-backend.onrender.com npm run build
          echo "Build completed - checking dist folder:"
          ls -la dist/
        env:
          VITE_API_URL: https://hackathon-infinity-backend.onrender.com
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist